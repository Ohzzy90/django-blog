{% extends 'blogs/parent.html' %}
{% load crispy_forms_tags %}
{% block contents %}
<div class="col-11 col-md-8 col-lg-6 mx-auto">
    <form method="POST" class="p-3 shadow-sm rounded bg-light border">
        {% csrf_token %}
        <legend class="border-bottom pb-2 mb-3">Leave a comment</legend>
        {{ cf|crispy }}
        <div class="mt-3">
            <button class="btn btn-success btn-block">Post Comment</button>
        </div>
    </form>
</div>
{% endblock %}
